version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tutoron_postgres
    environment:
      POSTGRES_DB: tutoron_db
      POSTGRES_USER: tutoron_user
      POSTGRES_PASSWORD: tutoron_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutoron_user -d tutoron_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tutoron_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: tutoron_backend_api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://tutoron_user:tutoron_password@db:5432/tutoron_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-tutoron-docker-dev-secret-key-replace-in-prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: .
    container_name: tutoron_celery_worker
    command: celery -A my_learning_project worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://tutoron_user:tutoron_password@db:5432/tutoron_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-tutoron-docker-dev-secret-key-replace-in-prod
    depends_on:
      - web
      - redis

  celery-beat:
    build: .
    container_name: tutoron_celery_beat
    command: celery -A my_learning_project beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://tutoron_user:tutoron_password@db:5432/tutoron_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-tutoron-docker-dev-secret-key-replace-in-prod
    depends_on:
      - web
      - redis

volumes:
  postgres_data:
